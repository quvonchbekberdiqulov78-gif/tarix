name: Test question extraction checks

on:
  pull_request:
    branches: [main]
    paths:
      - "test_ai.py"
      - "gemini_manager.py"
      - "main.py"
      - "miniapp.html"
      - "tests/**"
      - ".github/workflows/test-ai.yml"
  push:
    branches: [feature/gemini-test-rebuild]
    paths:
      - "test_ai.py"
      - "tests/**"
      - ".github/workflows/test-ai.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install aiohttp python-docx
      - name: Run extraction unit tests
        run: python -m unittest discover -s tests -v
